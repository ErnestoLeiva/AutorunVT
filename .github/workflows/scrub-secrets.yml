name: Scrub example INI

on:
  push:
    branches: [main, master]
    paths:
      - "config.ini.example"
      - ".github/scripts/scrub_ini.py"
      - ".github/workflows/scrub-secrets.yml"

concurrency:
  group: scrub-ini-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset config.ini.example placeholders
        run: python3 .github/scripts/scrub_ini.py config.ini.example

      - name: Commit if changed
        run: |
          if git diff --quiet -- config.ini.example; then
            echo "Already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.ini.example
          git commit -m "chore: reset config.ini.example placeholders [skip ci]"
          git push
